<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body class="ax-root" style="margin:0">
<div id="root" style="padding:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center"></div>
<script>
  var A = window.AxonCore, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16 } },
    h('div', { style: { display: 'flex', gap: 12, flexWrap: 'wrap', alignItems: 'center' } },
      h(A.Button, { variant: 'primary' }, 'Hablar con ventas'), h(A.Button, { variant: 'signal' }, 'Solicitar demo'),
      h(A.Button, { variant: 'secondary' }, 'Ver arquitectura'), h(A.Button, { variant: 'ghost' }, 'Docs'), h(A.Button, { variant: 'danger' }, 'Eliminar pipeline')),
    h('div', { style: { display: 'flex', gap: 12, flexWrap: 'wrap', alignItems: 'center' } },
      h(A.Button, { variant: 'signal', size: 'lg' }, 'Desplegar modelo'), h(A.Button, { variant: 'primary', size: 'sm' }, 'Crear'),
      h(A.Button, { variant: 'secondary', loading: true }, 'Sincronizando'), h(A.Button, { variant: 'primary', disabled: true }, 'Disabled'))));
</script>
</body>
</html>
