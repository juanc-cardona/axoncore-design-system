name: Design system CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm run check
      - name: dist is up to date
        run: git diff --exit-code -- dist || (echo "Run npm run build and commit dist/" && exit 1)
